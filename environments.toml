# ORIGINAL: development utilizaba una red Stellar local.
#
# [development.network]
# rpc-url = "http://localhost:8000/rpc"
# network-passphrase = "Standalone Network ; February 2017"
# run-locally = true # automatically start the local network container, if not already running

# CAMBIO: hacemos que el entorno development utilice Stellar Testnet.
[development.network]
rpc-url = "https://soroban-testnet.stellar.org"
network-passphrase = "Test SDF Network ; September 2015"


[[development.accounts]]
name = "deployer" # Required. Keys for this account will be saved to `./.stellar/identity`
default = true # Optional. Whether to use this account as the `--source` for commands that need one.
# TATTOO APP: una cuenta solo para desplegar. Subir el contrato a testnet cuesta casi
# todo el XLM que da Friendbot, así que lxs artistas usan cuentas aparte.

[[development.accounts]]
name = "wilo"

# TATTOO APP: artistas reales de ejemplo (y una cuenta de cliente) para que la demo tenga datos
[[development.accounts]]
name = "alma"

[[development.accounts]]
name = "cora"

[[development.accounts]]
name = "stacey"

[[development.accounts]]
name = "roro"

[[development.accounts]]
name = "boban"

[[development.accounts]]
name = "zeze"

[[development.accounts]]
name = "ina"

[[development.accounts]]
name = "julim"

[[development.accounts]]
name = "cliente"

[development.contracts]
# TATTOO APP: contratos de ejemplo del taller desactivados. Sin `client = false`,
# Scaffold igual los despliega por estar en el workspace.
fungible_allowlist_example = { client = false }
nft_enumerable_example = { client = false }
guess_the_number = { client = false }
# TATTOO APP: desactivado para que el primer `npm start` sea más rápido
# fungible_allowlist_example = { client = true, constructor_args = "--name ExampleToken --symbol EXT --admin me --manager me --initial_supply 1000000000000000000000000" }
